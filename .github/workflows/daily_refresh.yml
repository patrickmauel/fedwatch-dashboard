name: Daily FedWatch refresh

on:
  schedule:
    # 11:00 UTC = 7am ET (EDT) / 6am ET (EST) -- adjust to taste.
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write  # needed to commit the refreshed data/ folder back to the repo

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all pipelines
        run: |
          status=0
          for f in pipelines/*.py; do
            echo "=== Running $f ==="
            python "$f" || { echo "FAILED: $f"; status=1; }
          done
          exit $status

      - name: Commit and push updated data
        if: always()  # still commit data from pipelines that succeeded even if another one failed above
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes -- skipping commit."
          else
            git commit -m "Daily data refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
